```yaml
name: Backend CI

on:
  push:
    branches:
      - niraj-development
      - main

  pull_request:
    branches:
      - niraj-development
      - main

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check server.js
```