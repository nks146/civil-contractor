name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    
  
permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  IMAGE_NAME: ghcr.io/nks146/contractor-backend

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Prevent two production deployments from running simultaneously.
    concurrency:
      group: contractor-backend-production
      cancel-in-progress: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Starting deployment to EC2 through SSM..."

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -eu

          IMAGE="ghcr.io/nks146/contractor-backend:IMAGE_TAG_PLACEHOLDER"
          ENV_FILE="/home/ubuntu/contractor-backend.env"
          CONTAINER="contractor-backend"
          PREVIOUS="contractor-backend-previous"

          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Environment file not found."
            exit 1
          fi

          # Pull the new image before changing the running container.
          docker pull "$IMAGE"

          OLD_IMAGE=""
          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            OLD_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$CONTAINER")
          fi

          # Preserve any existing backup until the new deployment succeeds.
          if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
            echo "ERROR: A previous backup container already exists."
            echo "Inspect the containers before continuing."
            docker ps -a --filter "name=contractor-backend"
            exit 1
          fi

          # Preserve the current container for rollback.
          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            docker stop "$CONTAINER"
            docker rename "$CONTAINER" "$PREVIOUS"
          fi

          # Start the new container.
          if ! docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 5000:5000 \
            "$IMAGE"; then

            echo "ERROR: New container failed to start."

            if docker inspect "$CONTAINER" >/dev/null 2>&1; then
              docker rm -f "$CONTAINER"
            fi

            if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
              docker rename "$PREVIOUS" "$CONTAINER"
              docker start "$CONTAINER"
            fi

            exit 1
          fi

          # Wait for the application to start.
          READY=0
          for attempt in $(seq 1 12); do
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER" 2>/dev/null || true)" = "true" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                --max-time 3 http://127.0.0.1:5000/api/project || true)

              # This protected API is expected to return 401 without a token.
              case "$HTTP_CODE" in
                200|401)
                  READY=1
                  break
                  ;;
              esac
            fi

            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: New application failed its startup check."
            docker logs --tail 100 "$CONTAINER" || true
            docker rm -f "$CONTAINER" || true

            if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
              docker rename "$PREVIOUS" "$CONTAINER"
              docker start "$CONTAINER"
              echo "Previous container restarted."
            else
              echo "WARNING: No previous container available for rollback."
            fi

            exit 1
          fi

          # Deployment succeeded; remove the previous container.
          if docker inspect "$PREVIOUS" >/dev/null 2>&1; then
            docker rm -f "$PREVIOUS"
          fi

          echo "Deployment successful: $IMAGE"
          docker ps --filter "name=^/${CONTAINER}$"
          REMOTE
          )

          REMOTE_SCRIPT="${REMOTE_SCRIPT//IMAGE_TAG_PLACEHOLDER/$IMAGE_TAG}"

          PARAMETERS=$(jq -n --arg commands "$REMOTE_SCRIPT" \
            '{commands: [$commands]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy contractor backend ${IMAGE_TAG}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Poll SSM until the remote script finishes.
          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          # Retrieve the remote output for diagnosis.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out. Final status: $STATUS"
            exit 1
          fi

          echo "Production deployment completed successfully."