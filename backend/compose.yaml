services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractor-backend
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: contractor-db
    environment:
      MYSQL_ROOT_PASSWORD: dockerRoot@146#
      MYSQL_DATABASE: civilContractor
      MYSQL_USER: dbAdmin
      MYSQL_PASSWORD: db@146#
    volumes:
      - contractor-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dbAdmin", "-pdb@146#"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  contractor-mysql-data:
    external: true
